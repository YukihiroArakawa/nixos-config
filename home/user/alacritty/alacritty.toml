[terminal.shell]
program = "bash"
args = ["-lc", "exec \"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux_setup.sh\""]

[window.padding]
x = 8
y = 8

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
